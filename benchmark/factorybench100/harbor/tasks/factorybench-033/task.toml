schema_version = "1.4"

[task]
name = "blobfishai/factorybench-033"
version = "3.3.5"
description = "A safety bulletin names resin we still have on order, and the supplier cutoff is close. Establish which open quantity is actually affected and still cancelable, what has already been received or consumed, and whether replacement coverage makes cancellation safe. Stop only the covered purchase commitment."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

