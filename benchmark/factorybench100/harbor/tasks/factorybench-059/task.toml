schema_version = "1.4"

[task]
name = "blobfishai/factorybench-059"
version = "3.3.5"
description = "A completed project has copper left over and another program could use it. Determine what quantity is truly excess, whether finance has released its ownership, and the impact of transferring it versus leaving it with the project. Move only the approved residual quantity to common stores."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

