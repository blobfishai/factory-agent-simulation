schema_version = "1.4"

[task]
name = "blobfishai/factorybench-097"
version = "3.3.5"
description = "Plated housings are back from the supplier, but only accepted output should enter receiving. Determine the quantity supported by the shipment, outside-operation scope, lot, and inspection, explain the consequence of missing or rejected units, and create the receipt transaction for the defensible quantity. If the evidence still conflicts, keep the unsupported scope unchanged and leave operations with the unresolved risk and owner."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

