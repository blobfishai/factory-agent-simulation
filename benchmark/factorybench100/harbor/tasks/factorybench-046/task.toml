schema_version = "1.4"

[task]
name = "blobfishai/factorybench-046"
version = "3.3.5"
description = "The incumbent molded-parts source is constrained and procurement wants to use an alternate under conditions. Decide whether the alternate has cleared the necessary risk and quality evidence, how much demand the trial approval can cover, and what remains exposed if it is not used. Create only the supply allowed by the conditional approval."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

