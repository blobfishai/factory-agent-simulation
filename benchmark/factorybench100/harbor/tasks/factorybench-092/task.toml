schema_version = "1.4"

[task]
name = "blobfishai/factorybench-092"
version = "3.3.5"
description = "One invoice remains in the close batch and validation must not push an unsupported item into the period. Establish the matched amount, residual exception, accounting date, and cutoff impact, then compare validation with holding or correcting it. Validate only if the current period can properly absorb it."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

[agent]
user = "agent"
timeout_sec = 900.0

[verifier]
