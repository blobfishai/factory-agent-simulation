schema_version = "1.4"

[task]
name = "blobfishai/factorybench-031"
version = "3.3.5"
description = "We need to award the enclosure tooling package without mistaking the lowest sticker price for the best bid. Compare the technically acceptable offers on landed cost, lead time, capacity, and commercial exceptions, show whether the launch date and sourcing authority are protected, and identify the strongest fallback. Create the draft award only for the supported choice."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

