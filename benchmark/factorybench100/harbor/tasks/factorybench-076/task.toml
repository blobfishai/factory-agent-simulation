schema_version = "1.4"

[task]
name = "blobfishai/factorybench-076"
version = "3.3.5"
description = "A project build needs relays that are available elsewhere, but ownership and reservations must survive the move. Determine the quantity carrying the right project, task, lot, and approval, what must stay put, and whether transfer meets the build date. Post only the eligible project movement."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

