schema_version = "1.4"

[task]
name = "blobfishai/factorybench-050"
version = "3.3.5"
description = "A supplier incident damaged plant equipment and operations needs a repair plan plus a defensible vendor record. Determine the affected asset and supported damage scope, the earliest credible recovery, and whether internal repair or vendor recovery is better. Open the bounded maintenance work and preserve the supplier impact."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

[agent]
user = "agent"
timeout_sec = 900.0

[verifier]
user = "root"
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0

