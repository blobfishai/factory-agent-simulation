schema_version = "1.4"

[task]
name = "blobfishai/factorybench-067"
version = "3.3.5"
description = "The released router moves inspection to a different step, while the active order still carries the old sequence. Determine what open work is eligible for the change, whether the new work center has a safe slot, and the impact of moving now versus deferring. Update the supported operation only."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

