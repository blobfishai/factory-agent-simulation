schema_version = "1.4"

[task]
name = "blobfishai/factorybench-009"
version = "3.3.5"
description = "The original relay will miss the install window and engineering says a substitute may be available. Work out how much remaining demand the substitute can legally cover, what stock or orders fall outside its effectivity, and whether using it beats waiting or reducing the build. Change only the supported material requirement."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

[agent]
user = "agent"
timeout_sec = 900.0

[verifier]
user = "root"
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0

[[environment.mcp_servers]]
name = "factorybench"
transport = "streamable-http"
url = "http://world:8765/mcp/factorybench"

[[environment.mcp_servers]]
name = "gmail"
transport = "streamable-http"
url = "http://world:8765/mcp/gmail"

[[environment.mcp_servers]]
name = "google_drive"
transport = "streamable-http"
url = "http://world:8765/mcp/google_drive"

[[environment.mcp_servers]]
name = "google_sheets"
transport = "streamable-http"
url = "http://world:8765/mcp/google_sheets"

[[environment.mcp_servers]]
name = "oracle_fusion"
transport = "streamable-http"
url = "http://world:8765/mcp/oracle_fusion"

[[environment.mcp_servers]]
name = "slack"
