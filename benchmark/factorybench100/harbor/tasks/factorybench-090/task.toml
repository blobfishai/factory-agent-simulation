schema_version = "1.4"

[task]
name = "blobfishai/factorybench-090"
version = "3.3.5"
description = "A safety interlock was bypassed and production is asking when the asset can run again. Establish the actual equipment exposure and repair scope, compare qualified internal and external recovery options, and identify the earliest safe return-to-service. Open the corrective work without releasing the asset beyond the safety approval."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

[agent]
user = "agent"
timeout_sec = 900.0

[verifier]
user = "root"
timeout_sec = 120.0

