version = "3.3.0"
description = "A priority service request needs constrained material that is also wanted by regular production. Determine what the approved allocation actually reserves, the uncovered service need and delivery date, and the customer impact of each feasible source. Create only the service-scoped supply decision. If the evidence still conflicts, keep the unsupported scope unchanged and leave operations with the unresolved risk and owner."
