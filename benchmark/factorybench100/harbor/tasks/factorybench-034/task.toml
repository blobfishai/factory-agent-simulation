schema_version = "1.4"

[task]
name = "blobfishai/factorybench-034"
version = "3.3.5"
description = "The calibration-services PO looks complete, but the close must not hide an unaccepted service or unmatched invoice. Determine whether every dollar is received, accepted, invoiced, and approved, explain the remaining exposure if any, and decide whether closing now or leaving it open is correct. Apply the supported close action."
authors = [{ name = "Blobfish AI" }]
