schema_version = "1.4"

[task]
name = "blobfishai/factorybench-060"
version = "3.3.5"
description = "The physical count is below the kanban minimum, but an open replenishment may already cover part of the gap. Determine the true shortage, when existing and new supply would arrive, and whether expediting is justified. Create only the additional replenishment the approved exception requires. If the evidence still conflicts, keep the unsupported scope unchanged and leave operations with the unresolved risk and owner."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

[agent]
user = "agent"
timeout_sec = 900.0

[verifier]
user = "root"
timeout_sec = 120.0

