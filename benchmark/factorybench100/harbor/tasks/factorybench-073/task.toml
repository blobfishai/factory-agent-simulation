schema_version = "1.4"

[task]
name = "blobfishai/factorybench-073"
version = "3.3.5"
description = "The final physical count found fewer good units than the operation history reports. Determine the completed, rejected, missing, and scrapped quantities that make the order reconcile, explain the cost and output impact, and decide whether the loss belongs in this period. Post only the supported scrap transaction."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

[agent]
user = "agent"
timeout_sec = 900.0

[verifier]
user = "root"
timeout_sec = 120.0

