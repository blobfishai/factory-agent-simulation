schema_version = "1.4"

[task]
name = "blobfishai/factorybench-001"
version = "2.0.0"
description = "You are the order fulfillment manager for Northstar Controls. Resolve FACTORYBENCH-001 (Expedite a penalty-backed hospital order). Verify the signed service-level addendum and planner approval, then move the linked production supply to the approved commit date and notify the account team. The case is an isolated snapshot as of 2026-01-12; correlate immutable IDs and effective revisions rather than matching names alone. Evidence is distributed across Oracle Fusion, Gmail, Drive, Sheets, and Slack, with inspectable files including `operating-policy.md`, `contract-or-service-control.md`, `supplier-quotation.pdf`, `supplier-lead-time-and-capacity.xlsx`, `approval-decision-log.csv`, `source-email-thread.eml`, `operations-slack-thread.json`, `drive-approval-record.json`. After the documented Oracle operation, write the outcome into the existing control-workbook cell; then create the requested email draft without sending it. Return exactly: order_number, supply_action, revised_commit_date."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

