schema_version = "1.4"

[task]
name = "blobfishai/factorybench-004"
version = "3.3.5"
description = "The controller configuration on an open customer order is obsolete, but several similar replacement records are circulating. Determine which open units are genuinely covered by the released change, explain what cannot be touched, and decide whether substitution, waiting for the old part, or asking the customer for a deviation is the safest path. Apply the authorized choice."
authors = [{ name = "Blobfish AI" }]
keywords = ["manufacturing", "erp", "oracle-fusion", "multi-system", "stateful", "deterministic"]

[agent]
user = "agent"
timeout_sec = 900.0

[verifier]
user = "root"
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048
gpus = 0

